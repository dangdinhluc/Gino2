name: Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Legacy tests
        run: npm run test:legacy

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify generated PWA assets
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          grep -q './assets/app-images/mascot-brand.webp' dist/manifest.webmanifest
          grep -q "new URL('assets/app-images/game-tanuki.webp', self.registration.scope)" dist/sw.js
