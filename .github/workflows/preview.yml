name: Deploy UX preview

on:
  push:
    branches: [ux/mock-navigation-refactor]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      VITE_DATA_MODE: real
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          path: preview-src

      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloud configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"

      - name: Validate preview
        working-directory: preview-src
        run: |
          npm ci
          npm run lint
          npm run test
          npm run typecheck

      - name: Build production root
        working-directory: production-src
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Build UX preview
        working-directory: preview-src
        run: |
          npm run build -- --base=/Gino2/preview/

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/preview
          cp -a production-src/dist/. site/
          cp -a preview-src/dist/. site/preview/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      - name: Deploy combined production and preview
        id: deployment
        uses: actions/deploy-pages@v4
