name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - ux/mock-navigation-refactor
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      VITE_DATA_MODE: real
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-src

      - name: Checkout UX preview branch
        uses: actions/checkout@v4
        with:
          ref: ux/mock-navigation-refactor
          path: preview-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloud configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"

      - name: Validate production
        working-directory: production-src
        run: |
          npm ci
          npm run lint
          npm run test
          npm run typecheck

      - name: Build production root
        working-directory: production-src
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Validate UX preview
        working-directory: preview-src
        run: |
          npm ci
          npm run lint
          npm run test
          npm run typecheck

      - name: Build UX preview
        working-directory: preview-src
        run: npm run build -- --base=/Gino2/preview/

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/preview
          cp -a production-src/dist/. site/
          cp -a preview-src/dist/. site/preview/
          cp site/index.html site/404.html
          python - <<'PY'
          from pathlib import Path
          path = Path('site/404.html')
          html = path.read_text()
          redirect = """<script>if (location.pathname.startsWith('/Gino2/preview/') && location.pathname !== '/Gino2/preview/') { location.replace('/Gino2/preview/'); }</script>"""
          path.write_text(html.replace('<head>', '<head>' + redirect, 1))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production + preview
        id: deployment
        uses: actions/deploy-pages@v4
