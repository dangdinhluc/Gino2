name: Dispatch learner notifications

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Queue and dispatch notifications
        env:
          NOTIFICATION_DISPATCH_SECRET: ${{ secrets.NOTIFICATION_DISPATCH_SECRET }}
        run: |
          test -n "$NOTIFICATION_DISPATCH_SECRET"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
            -X POST 'https://tdwjqgxbrdmxwlplopft.supabase.co/functions/v1/notification-dispatch' \
            -H "x-notification-dispatch-secret: $NOTIFICATION_DISPATCH_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{"batchSize":25}'
          printf '\n'
